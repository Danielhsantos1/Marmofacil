<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6A5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Projetta</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de campo em uma coluna, barra de abas fixa embaixo, editor em tela cheia com resumo de preço sempre visível. */
:root{
  --bg:#EDEFEE; --surface:#FFFFFF; --surface2:#E2E6E4; --fg:#15191A; --muted:#5C6664; --line:#CDD3D1;
  --accent:#0E6A5B; --accent-fg:#FFFFFF; --accent-soft:#D5ECE6;
  --ok:#1D7A46; --warn:#A8620B; --bad:#B3321F; --slab:#D9DEDB; --slab-line:#8C9794; --dim:#1D5FD1; --emenda:#D9480F;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#1A201F; --surface2:#242C2A; --fg:#E8EEEC; --muted:#93A09D; --line:#303A38;
  --accent:#3DBBA3; --accent-fg:#06201A; --accent-soft:#17332D;
  --ok:#5BC48B; --warn:#E3A24F; --bad:#EE7C6A; --slab:#2B3432; --slab-line:#5E6C69; --dim:#8DB8FF; --emenda:#FF9166; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#1A201F; --surface2:#242C2A; --fg:#E8EEEC; --muted:#93A09D; --line:#303A38;
  --accent:#3DBBA3; --accent-fg:#06201A; --accent-soft:#17332D;
  --ok:#5BC48B; --warn:#E3A24F; --bad:#EE7C6A; --slab:#2B3432; --slab-line:#5E6C69; --dim:#8DB8FF; --emenda:#FF9166; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em} h2{font-size:17px} h3{font-size:14px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}
.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.tap{cursor:pointer}.card.tap:active{background:var(--surface2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:11px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:active{background:var(--surface2)}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.pri:active{filter:brightness(.92)}
button.ghost{border-color:transparent;background:transparent;padding:8px 10px;min-height:40px}
button.danger{color:var(--bad)} button.sm{min-height:36px;padding:6px 10px;font-size:13px}
/* passos do orçamento */
.steps{display:flex;gap:2px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.steps button{flex:1 1 0;min-width:44px;min-height:62px;flex-direction:column;gap:4px;border:0;background:none;padding:2px 1px;font-size:10.5px;font-weight:700;color:var(--muted)}
.steps .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--surface);transition:transform .15s,background .15s}
.steps .dot svg{width:17px;height:17px}
.steps button.feito .dot{border-color:var(--accent);color:var(--accent)}
.steps button[aria-current=step]{color:var(--fg)}
.steps button[aria-current=step] .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:scale(1.14)}
.sum .nextb{min-height:52px;padding:8px 18px;font-size:16px;white-space:nowrap;flex:none}
.sum .voltarb{min-height:52px;min-width:48px;font-size:26px;color:var(--bg);flex:none;padding:0 12px}
.e3mats.grande,.grande .e3mats{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
@media (prefers-reduced-motion:no-preference){.stepin{animation:stepin .2s ease-out}@keyframes stepin{from{opacity:0;transform:translateY(8px)}}}
button.big{min-height:56px;font-size:16px;gap:10px;justify-content:center;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)} textarea{min-height:76px;resize:vertical}
input[type=file]{display:none}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.chip.c-Rascunho{background:var(--surface2)} .chip.c-Enviado{background:var(--accent-soft);color:var(--accent)}
.chip.c-Negociação{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.c-Fechado{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.c-Perdido{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;flex-direction:column;gap:2px;border:0;background:none;font-size:11.5px;color:var(--muted);min-height:52px;padding:6px 2px}
.tabs button[aria-current=page]{color:var(--accent)} .tabs svg{width:22px;height:22px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:38px;padding:7px 12px;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kpi{display:flex;flex-direction:column;gap:2px}.kpi b{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.02em}
.sum{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sum b{font-family:var(--mono);font-size:20px;font-weight:600}.sum small{opacity:.7;font-size:11.5px;display:block}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet .li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}.sheet .li:first-child{border-top:0}
.li .num{white-space:nowrap}
.draw{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:hidden}
.draw svg{display:block;width:100%;height:auto;max-height:340px}
.draw text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.scroll-x{overflow-x:auto;padding-bottom:8px}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 78%;max-width:300px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.ex{font-size:11px;font-weight:700;color:var(--warn);letter-spacing:.04em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:40;max-width:90%;font-size:14px}
.bar3d{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar3d button{padding:4px 2px;font-size:12.5px}
@media (max-width:350px){.bar3d{grid-template-columns:repeat(2,1fr)}.bar3d button{font-size:13px}}
@media (max-height:480px) and (orientation:landscape){.sum{position:static}#v3dbox{height:calc(100vh - 150px)!important;min-height:180px!important}}
#v3dbox{scroll-margin-top:72px}
.row3d{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.k3d[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.upd{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:50;width:min(92%,420px);background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.upd span{flex:1}
.lock{border-left:4px solid var(--ok)}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:18px;font-size:13.5px}
.doc h2{color:#111}.doc table{width:100%;border-collapse:collapse}.doc td,.doc th{padding:6px 4px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
.doc td:last-child,.doc th:last-child{text-align:right;white-space:nowrap}
/* Tela "O que deseja projetar?" (v29) */
.mods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:768px){.mods{grid-template-columns:repeat(3,1fr)}}@media(min-width:1024px){.mods{grid-template-columns:repeat(4,1fr)}}
.mod{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:116px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.mod .mi{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:grid;place-items:center}.mod .mi svg{width:22px;height:22px}
.mod b{font-size:15px}.mod .small{line-height:1.3}.mod .selo{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.mod.on:hover{border-color:var(--accent)}.mod[aria-disabled=true]{opacity:.78}
/* ===== Layout responsivo (v28): mobile < 768 | tablet 768 | notebook 1024 | desktop 1440 | ultrawide 1920.
   Mobile continua com a barra inferior; a partir de 1024 px ela vira sidebar. O conteúdo é o mesmo em todos os tamanhos. ===== */
.brand{display:none}
@media (min-width:768px){#app{max-width:860px}}
@media (min-width:1024px){
  :root{--side:84px}
  body{padding-left:calc(var(--side) + 28px);padding-right:28px}
  .tabs{top:0;right:auto;bottom:0;width:var(--side);flex-direction:column;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:12px 8px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7AA0FF);flex:none}.brand span{display:none}
  .tabs button{flex:none;min-height:60px;border-radius:10px}.tabs button:hover{background:var(--bg)}.tabs button[aria-current=page]{background:var(--bg)}
  #app{max-width:1180px;margin:0 auto;padding-bottom:40px}#app[data-view=home]{max-width:1400px}
  [data-view=home] .grid2{grid-template-columns:repeat(4,1fr)}.dash2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .sum{bottom:16px}.toast{bottom:32px;left:calc(50% + var(--side)/2)}
}
@media (min-width:1440px){
  :root{--side:232px}
  .brand span{display:inline}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:0 14px;min-height:46px}
  #app{max-width:1280px}#app[data-view=home]{max-width:1520px}
}
@media (min-width:1920px){#app{max-width:1440px}#app[data-view=home]{max-width:1640px}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* Editor 3D em tela cheia: celular = 3D em cima e menu embaixo; computador/celular deitado = menu lateral */
#ed3d{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.e3top{position:relative;display:flex;align-items:center;gap:4px;min-height:46px;padding:2px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.e3top .tt{flex:1;min-width:0;line-height:1.2}.e3top b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.e3top small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e3salvo{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 6px}.e3salvo.ok{color:var(--ok)}
.e3ib{flex:none;width:44px;min-width:44px;height:44px;padding:0;justify-content:center;color:var(--fg)}.e3ib svg{width:22px;height:22px}.e3ib:disabled{opacity:.32}
.e3opcoes{position:absolute;right:8px;top:calc(100% + 4px);z-index:30;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,25,23,.16);padding:6px;display:flex;flex-direction:column}
.e3opcoes button{justify-content:flex-start;border:0;background:none;min-height:46px;padding:8px 12px;border-radius:8px;font-weight:600}.e3opcoes button:hover{background:var(--surface2)}
.tbundo{display:none}
.alca-dot{transition:transform .12s}
@media (pointer:fine){.alca-dot{transform:scale(.7)}[role=button]:hover>.alca-dot{transform:scale(.95)}}   /* mouse: pontos de seleção discretos (a área de clique continua grande) */
.e3main{flex:1;min-height:0;display:flex;flex-direction:column}
.e3stage{flex:1;min-height:150px;position:relative;order:1}
#ed3d #v3dbox{position:absolute;inset:0;height:100%!important;min-height:0!important;border:0;border-radius:0}
.e3vistas{position:absolute;top:8px;left:8px;right:8px;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.e3vistas::-webkit-scrollbar{display:none}
.e3vistas button{flex:none;padding:6px 12px;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.e3vistas svg{width:22px;height:22px;flex:none;display:none}
.e3vistas button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.e3chip{position:absolute;right:8px;bottom:8px;z-index:5;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;min-width:176px;font-size:12.5px;line-height:1.3;text-align:right;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.e3chip b{font-family:var(--mono);font-size:16px}
.e3chip .res{display:flex;justify-content:space-between;align-items:baseline;gap:14px}.e3chip .res small{color:var(--muted)}
.e3chip .ext{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.e3chip .ext b{font-family:var(--font);font-size:12px;color:var(--fg)}
.e3chip .aviso{margin-top:4px;color:var(--warn);font-size:11.5px;font-weight:600}
.e3chip .seta{display:inline-block;transition:transform .15s;margin-left:4px}.e3chip[aria-expanded=true] .seta{transform:rotate(180deg)}
.e3dock{order:2;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.e3rail{display:flex;overflow-x:auto;scrollbar-width:none}.e3rail::-webkit-scrollbar{display:none}
.e3rail button{flex:1 0 auto;flex-direction:column;gap:2px;border:0;border-radius:0;background:none;color:var(--muted);font-size:11.5px;min-width:64px;min-height:52px;padding:6px 8px}
.e3rail button[aria-selected=true]{color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.e3rail svg{width:22px;height:22px}
.e3voltar{display:none!important}
.e3tt{display:none}
.e3panel{max-height:36vh;overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.e3dock.fechado .e3panel{display:none}
.e3panel .lbl{margin-bottom:0}
.e3panel>*{flex:none}
.e3mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.e3mat{flex-direction:column;align-items:stretch;gap:4px;padding:4px;min-height:0;font-weight:600;font-size:11.5px;line-height:1.15;text-align:center;border-radius:10px}
.e3mat[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.e3sw{display:block;position:relative;aspect-ratio:1.5;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.e3sw img{width:100%;height:100%;object-fit:cover;display:block}
.e3sw i{position:absolute;right:2px;top:2px;font-style:normal;background:var(--warn);color:#fff;border-radius:99px;font-size:10px;padding:1px 5px}
.e3nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e3tipos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.e3tipos button{flex-direction:column;gap:4px;min-height:64px;padding:8px 4px;font-size:12.5px;line-height:1.1}
.e3tipos button svg{width:30px;height:30px;color:var(--muted)}
.e3tipos button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.e3tipos button[aria-pressed=true] svg{color:var(--accent)}
@media (min-width:820px),(max-height:500px) and (orientation:landscape){
  /* tela larga ou celular deitado: sem faixa de cima. Voltar fica no menu lateral, as ferramentas viram uma coluna de ícones sobre o 3D
     e o painel recolhe para o 3D ocupar a tela toda */
  #ed3d{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .e3main{flex-direction:row}
  .e3dock{order:0;flex-direction:row;border-top:0;border-right:1px solid var(--line);padding-bottom:0}
  .e3rail{flex-direction:column;overflow-y:auto;width:72px;border-right:1px solid var(--line)}
  .e3rail button{flex:none;min-width:0;width:100%;min-height:58px;padding:4px 2px;font-size:10.5px}
  .e3rail button[aria-selected=true]{box-shadow:inset 3px 0 0 var(--accent)}

<script>
/* Rede de segurança de abertura. Se o app não conseguir abrir (por exemplo, arquivos de versões diferentes
   no cache do celular), limpa SÓ o cache do app e tenta de novo uma vez; se ainda falhar, mostra uma tela
   com saída. Nunca apaga nem altera os dados salvos (localStorage). */
(function(){
  const FLAG='pf-cura';let mostrou=false;
  const aberto=()=>!!document.querySelector('#tabs button');
  const jaTentou=()=>{try{return sessionStorage.getItem(FLAG)==='1'}catch(e){return window.name===FLAG}};
  const marcar=()=>{try{sessionStorage.setItem(FLAG,'1')}catch(e){window.name=FLAG}};
  window.pfAbriu=()=>{try{sessionStorage.removeItem(FLAG)}catch(e){}if(window.name===FLAG)window.name=''};
  async function curar(){
    try{const k=await caches.keys();await Promise.all(k.filter(x=>/^(marmofacil|pedra-facil)-/.test(x)).map(x=>caches.delete(x)))}catch(e){}
    try{const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}catch(e){}
    try{await Promise.all([location.href,...[...document.scripts].map(x=>x.src).filter(Boolean)].map(u=>fetch(u,{cache:'reload'})))}catch(e){}   // baixa de novo, ignorando o cache do navegador
    location.reload();
  }
  function baixarDados(){
    let t='';try{t=localStorage.getItem('pedrafacil.v1')||''}catch(e){}
    if(!t){alert('Não há dados salvos neste endereço.');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
    a.download='marmofacil-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  }
  function tela(msg){
    if(mostrou)return;const d=document.getElementById('app');if(!d)return;mostrou=true;
    d.innerHTML='<div class="stack" style="padding-top:24px"><h1>O app não conseguiu abrir</h1>'+
      '<div class="card stack"><div>Seus dados continuam guardados neste aparelho. Toque em <b>Tentar de novo</b>. Se não resolver, baixe uma cópia dos dados antes de qualquer outra coisa.</div>'+
      '<button class="pri" id="pfTentar">Tentar de novo</button><button id="pfBaixar">Baixar cópia dos meus dados</button></div>'+
      '<div class="small muted">Detalhe técnico para suporte:</div><pre class="small" id="pfMsg" style="white-space:pre-wrap;word-break:break-word"></pre></div>';
    document.getElementById('pfMsg').textContent=msg;
    document.getElementById('pfTentar').onclick=curar;document.getElementById('pfBaixar').onclick=baixarDados;
  }
  function falhou(msg){
    setTimeout(()=>{
      if(aberto())return;
      if(!jaTentou()){marcar();curar();return}
      tela(msg);
    },50);
  }
  addEventListener('error',e=>{
    const t=e.target;if(t&&t!==window&&t.tagName!=='SCRIPT')return;            // fontes e imagens não contam
    falhou((e.message||('Não carregou '+(t&&t.src)))+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''));
  },true);
})();
</script>

/* ===== Desenho SVG (cotas em cm, escala automática) ===== */
function drawPiece(p){
  const {rects}=shape(p);
  if(!rects.length)return '<div class="muted small" style="padding:24px;text-align:center">Adicione medidas para ver o desenho.</div>';
  const pad=34;
  const W=Math.max(...rects.map(a=>a.x+a.w)),H=Math.max(...rects.map(a=>a.y+a.h));
  const sc=Math.min(560/Math.max(W,1),300/Math.max(H,1));
  const vw=W*sc+pad*2,vh=H*sc+pad*2;
  let s=`<svg viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="Desenho de ${esc(p.name)}">`;
  rects.forEach(a=>{
    const x=pad+a.x*sc,y=pad+a.y*sc,w=a.w*sc,h=a.h*sc;
    const fill=a.kind==='extra'?'color-mix(in srgb,var(--accent) 22%,var(--surface))':a.kind==='riser'?'var(--surface2)':'var(--accent-soft)';
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="var(--accent)" stroke-width="1.5"/>`;
    if(w>46&&h>16)s+=`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle">${esc(a.l)} ${nf(a.w,0)}×${nf(a.h,0)}</text>`;
  });
  /* recortes válidos (só os que couberem inteiros num tampo; os inválidos ficam de fora e aparecem como aviso) */
  Model3D.buildModel(p,2).recortes.forEach(r=>{
    const x=pad+r.x*sc,y=pad+r.z*sc,w=r.w*sc,h=r.d*sc;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
    if(w>58&&h>16)s+=`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" style="fill:var(--warn)">${esc(r.tipo)} ${nf(r.w,0)}×${nf(r.d,0)}${r.origem==='estimado'?' (est.)':''}</text>`;
  });
  /* cotas gerais */
  s+=`<g stroke="var(--muted)" stroke-width="1" fill="none"><path d="M${pad} ${pad-14}H${pad+W*sc}M${pad} ${pad-19}v10M${pad+W*sc} ${pad-19}v10"/>`;
  s+=`<path d="M${pad-14} ${pad}V${pad+H*sc}M${pad-19} ${pad}h10M${pad-19} ${pad+H*sc}h10"/></g>`;
  s+=`<text x="${pad+W*sc/2}" y="${pad-20}" text-anchor="middle">${nf(W,0)} cm</text>`;
  s+=`<text transform="translate(${pad-20} ${pad+H*sc/2}) rotate(-90)" text-anchor="middle">${nf(H,0)} cm</text></svg>`;
  return s;
}

function drawSlabs(c){

    out+=`<svg viewBox="0 0 ${SL*sc+2} ${SW*sc+2}" role="img" aria-label="Chapa ${i+1}"><rect x="1" y="1" width="${SL*sc}" height="${SW*sc}" fill="var(--slab)" stroke="var(--slab-line)" stroke-width="1.5"/>`;
    sl.items.forEach(a=>{
      const w=a.w*sc,h=a.h*sc;
      out+=`<rect x="${1+a.x*sc}" y="${1+a.y*sc}" width="${w}" height="${h}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;

  });

}

/* Chapa e espessura de hoje, para o 3D do orçamento fechado desenhar o mesmo que foi cobrado (espessura 0 = padrão). */
const chapaDoFechamento=(q,c)=>({SL:c.SL,SW:c.SW,thick:matOf(q)?.thick>0?matOf(q).thick:0});
/* Fechar congela os valores (q.snap); qualquer outra etapa descongela. Devolve false se não puder fechar. */
function setStatus(q,st){
  if(st==='Fechado'){
    if(q.status!=='Fechado'||!q.snap){
      const c=calcQuote(q,S.materials,S.services);
      if(c.erro){toast(c.erro);return false}
      q.snap=snapshotOf(c,Date.now(),chapaDoFechamento(q,c));
    }
    if(q.status!=='Fechado')q.closedAt=Date.now();
  }else{delete q.snap;q.closedAt=null}
  q.status=st;save();return true;
}
/* Orçamentos fechados antes desta versão (ou de backups antigos) ganham o snapshot com os valores de hoje. */
function garantirSnapshots(){
  let mudou=false;
  S.quotes.forEach(q=>{if(q.status==='Fechado'&&!q.snap){const c=calcQuote(q,S.materials,S.services);q.snap=snapshotOf(c,Date.now(),chapaDoFechamento(q,c));q.snap.migrado=true;mudou=true}});
  if(mudou)save();
}

const step=(o,k)=>Array.isArray(o)?(/^\d+$/.test(k)?o[+k]:o.find(x=>x.id===k)):o[k];
function getPath(path){let o=S;for(const k of path.split('.')){if(o==null)return;o=step(o,k)}return o}
function setPath(path,val){const ks=path.split('.'),last=ks.pop();let o=S;for(const k of ks){o=step(o,k);if(o==null)return}o[last]=val}
function fld(label,path,type='t',opt={}){
  const v=getPath(path);
  const inp=type==='n'?`<input type="number" inputmode="decimal" step="${opt.step||'any'}" min="${opt.min??0}" value="${v??''}" data-b="${path}" data-t="n">`
   :type==='area'?`<textarea data-b="${path}" data-t="t">${esc(v)}</textarea>`
   :`<input type="${opt.kind||'text'}" value="${esc(v)}" data-b="${path}" data-t="t" ${opt.ph?`placeholder="${esc(opt.ph)}"`:''}>`;
  return `<label class="f">${label}${opt.unit?` <span style="font-weight:500">(${opt.unit})</span>`:''}${inp}</label>`;
}
function sel(label,path,options,opt={}){
  const v=getPath(path)??'';
  return `<label class="f">${label}<select data-b="${path}" data-t="${opt.n?'n':'t'}" ${opt.full?'data-full="1"':''}>${opt.blank?`<option value="">${opt.blank}</option>`:''}${options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
}

const STEPS=[['cli','Cliente'],['med','Medir'],['mat','Material'],['svc','Serviços'],['cal','Preço'],['orc','Enviar']];
function passoVizinho(dir){
  let i=STEPS.findIndex(x=>x[0]===nav.sec);const fora=i<0;if(fora)i=1;                  // Fotos e IA: conta como depois de Medir
  const j=dir==='next'?i+1:(fora?i:i-1);return STEPS[j]||null;

const RECORTAVEL=['reta','lavatorio','ilha','L','U'];
const TIPOS_REC=[['cuba','Cuba'],['cooktop','Cooktop'],['outro','Outro']];
/* status de UM recorte, para aparecer dentro do cartão dele (logo abaixo das medidas) */
function rcStatus(st){
  if(!st)return '';
  return st.ok?(st.motivo?`<span style="color:var(--warn)">⚠ ${esc(st.motivo)}</span>`:'<span style="color:var(--ok)">✓ Desenhado na peça.</span>')
              :`<span style="color:var(--warn)">⚠ Não desenhado: ${esc(st.motivo)}</span>`;
}
function rcModelo(q,p){const c=calc(q);return Model3D.buildModel(p,{espessura:matOf(q)?.thick,SL:c.SL,SW:c.SW})}
function rcInfo(q,p){
  const L=p.recortes||[];if(!L.length)return '';
  const c=calc(q),m=Model3D.buildModel(p,{espessura:matOf(q)?.thick,SL:c.SL,SW:c.SW});
  const av=m.avisos.filter(a=>/^Recorte/.test(a));
  const cont={};L.forEach(r=>{const k=r&&r.tipo||'outro';cont[k]=(cont[k]||0)+1});
  const resumo=Object.entries(cont).map(([k,n])=>n+' '+k).join(', ');
  return av.map(a=>`<div class="small" style="color:var(--warn)" role="status">⚠ ${esc(a)}</div>`).join('')
    +`<div class="small muted">${m.recortes.length} de ${L.length} desenhado${m.recortes.length===1?'':'s'} (${esc(resumo)}). Recortes não mudam a área nem o preço: confira em Serviços se o recorte de cuba e de cooktop está incluído.</div>`;
}
function recortesEd(q,p){
  const PP=`quotes.${q.id}.pieces.${p.id}`,modeloRc=rcModelo(q,p);
  const lista=(p.recortes||[]).map((r,i)=>{const R=`${PP}.recortes.${i}`;return `<div class="card stack" style="padding:12px;gap:8px">
    <div class="row between"><b>Recorte ${i+1}</b><button class="danger sm" data-act="del-recorte" data-v="${i}" aria-label="Remover recorte ${i+1}">✕</button></div>
    <div class="grid2">${sel('Tipo',R+'.tipo',TIPOS_REC)}${sel('Origem da medida',R+'.origem',[['medido','Medido'],['estimado','Estimado']])}
     ${fld('Da esquerda',R+'.x','n',{unit:'cm'})}${fld('Do fundo',R+'.z','n',{unit:'cm'})}
     ${fld('Largura',R+'.w','n',{unit:'cm'})}${fld('Profundidade',R+'.d','n',{unit:'cm'})}</div>
    <div class="small" id="rcs${i}" role="status">${rcStatus(modeloRc.statusRecortes[i])}</div></div>`}).join('');
  return `<div class="lbl">Recortes (cuba, cooktop...)</div>${lista}<div id="rcinfo" class="stack" style="gap:4px">${rcInfo(q,p)}</div>
    <button class="sm" data-act="add-recorte">+ Recorte</button>
    <div class="small muted">Meça da esquerda e do fundo (lado de trás) da peça inteira, em cm. Preencha as 4 medidas para o recorte aparecer no desenho.</div>`;
}

function dateBR(t){return new Date(t).toLocaleDateString('pt-BR')}
function descPiece(p){const d=p.d,t=TYPES[p.type];
  if(p.type==='livre')return (d.rects||[]).map(r=>`${nf(r.w,0)}×${nf(r.h,0)}${r.q>1?' ('+r.q+'x)':''}`).join(', ');
  return t.campos.map(([k,l])=>`${l.split(' (')[0]} ${nf(d[k],0)}${k==='N'?'':' cm'}`).join(' · ')}
function quoteData(q){
  const c=calc(q),cl=clientOf(q)||{};
  const items=q.pieces.map(p=>({nome:p.name||TYPES[p.type].nome,tipo:TYPES[p.type].nome,desc:descPiece(p),area:partsArea(shape(p).parts),
    extra:[p.saiaH>0?`saia ${nf(p.saiaH,0)} cm`:'',p.rodaH>0?`rodabanca ${nf(p.rodaH,0)} cm`:''].filter(Boolean).join(', ')}));
  const svcs=q.lines.map(l=>{const s=S.services.find(x=>x.id===l.svcId);return s?{nome:s.name,qtd:l.qty,un:s.unit}:null}).filter(Boolean);
  return {c,cl,items,svcs};
}

/* ===== Utilitários de arquivo e foto ===== */
function readImg(file,max=1000){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onerror=no;
    fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',0.72))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function dataUrlBlob(u){const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})}
async function saveFile(filename,data){
  const dl=await (window.claude?.use?window.claude.use('downloads'):null);
  if(!dl){const bl=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo baixado.');return}
  try{await dl.save({filename,data});toast('Arquivo pronto.')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o arquivo.')}
}

/* ===== PDF que vende ===== */
async function urlParaDataUrl(url){
  if(!url)return null;if(url.startsWith('data:'))return url;
  try{const r=await fetch(url);if(!r.ok)return null;const bl=await r.blob();
    return await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(bl)})}catch(e){return null}
}
/* aparência do material para o PDF (sempre "do material": não depende do que está escolhido na tela) */
function aparenciaPdf(q){
  const m=matOf(q);
  return {textura:{'Granito':'granito','Mármore':'marmore','Quartzo':'quartzo'}[m&&m.cat]||'liso',cor:corDaPedra(m&&m.color),foto:fotoDoMaterial(m)};
}
/* imagens 3D das peças (com cotas), tiradas com um visualizador próprio fora da tela. Sem WebGL ou com erro: o PDF sai sem imagem. */
async function imagens3dPdf(q){
  const sai={geral:null,pecas:[]};
  if(!q.pieces.length)return sai;
  let box=null,v=null;
  try{
    const mod=await import('./viewer3d.js?v=30');
    if(!mod.webglModo())return sai;
    box=document.createElement('div');box.setAttribute('aria-hidden','true');
    box.style.cssText='position:fixed;left:-10000px;top:0;width:700px;height:430px;pointer-events:none';document.body.appendChild(box);
    v=mod.criarVisualizador({brilho:mod.webglModo()==='gpu',cotas:(mo,l)=>mo.cotasDe?mo.cotasDe(l):Model3D.cotas(mo,l)});v.anexar(box);
    const ap=aparenciaPdf(q),lay=layout3d(q);
    /* "foto": vista isométrica, sem grade, fundo branco, bem mais pixels que a tela. Quadro pequeno em px CSS = texto das cotas maior no papel. */
    const foto=async(cena,cotas,w,h,escala)=>{box.style.width=w+'px';box.style.height=h+'px';
      v.atualizar(cena,false,{cotas,textura:ap.textura,cor:ap.cor,foto:ap.foto,equip:true});v.vista('iso');return await v.capturar({semGrade:true,escala})};
    const unica=q.pieces.length===1;
    if(!unica)sai.geral=await foto(Model3D.comporCena(lay.itens,0),false,700,430,2.4);
    for(let i=0;i<Math.min(q.pieces.length,4);i++){
      const it=lay.itens[i];if(it.modelo.vazio)continue;
      sai.pecas.push({indice:i,img:await foto(Model3D.comporCena([{modelo:it.modelo,off:[0,0],nome:it.nome}],0),true,i===0&&unica?700:420,i===0&&unica?430:258,i===0&&unica?2.4:2)});
    }
  }catch(e){console.warn('PDF sem imagem 3D',e)}
  finally{try{v&&v.destruir()}catch(e){}if(box)box.remove()}
  return sai;
}

function waTexto(q){
  const {c,cl}=quoteData(q);
  return `Olá${cl.name?', '+cl.name.split(' ')[0]:''}! Segue o orçamento 3D da sua ${q.pieces.length>1?'obra':'bancada'} em ${c.m?c.m.name:'material a definir'} (${resumoMedidas(q,c)}) - ${brl(c.price)}. PDF com foto real anexado. Posso aprovar?`;
}
function waUrl(q){
  const {c,cl,items}=quoteData(q),s=S.settings;
  let t=`Olá${cl.name?', '+cl.name.split(' ')[0]:''}! Segue o orçamento #${q.num} da ${s.empresa}.\n\n`;
  t+=`Material: ${c.m?c.m.name:'a definir'}\n`;
  items.forEach(i=>{t+=`• ${i.nome}: ${nf(i.area)} m²\n`});
  t+=`\nTotal: ${brl(c.price)}\nValidade: ${q.validade} dias.`;
  let d=(cl.phone||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;
  return `https://wa.me/${d}?text=${encodeURIComponent(t)}`;
}

/* ===== IA: leitura das fotos ===== */
async function runAI(q){
  const btn=$('#aiBtn'),out=$('#aiOut');
  const sample=await (window.claude?.use?window.claude.use('sample'):null);
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim?.images){out.innerHTML=aiHtml({erro:'A leitura de fotos por IA não está disponível nesta visualização.'});return}
  btn.disabled=true;btn.textContent='Analisando...';
  const blobs=q.photos.slice(0,3).map(dataUrlBlob);
  const prompt=`Você é um orçador experiente de marmoraria. As imagens são fotos do ambiente onde será instalada uma peça de pedra (bancada, lavatório, escada, nicho ou similar).
Use referências de escala visíveis (portas ~210 cm de altura, bancadas ~90 cm de altura e 55-65 cm de profundidade, azulejos, eletrodomésticos) para estimar medidas. Se não houver referência, diga isso no resumo e dê faixas conservadoras.
Materiais disponíveis na loja: ${S.materials.map(m=>m.name+' ('+m.cat+')').join('; ')||'nenhum cadastrado'}.
Responda somente com JSON neste formato, em português do Brasil:
{"resumo":"2 frases sobre o ambiente","medidas":[{"peca":"nome","comprimento_cm":0,"profundidade_cm":0}],"materiais":["até 3 nomes, priorizando os da loja"],"complexidade":{"nivel":"Baixa|Média|Alta","motivo":"1 frase"}}`;
  try{
    const r=await sample.json(prompt,{images:blobs,cache:false});
    q.ai={resumo:String(r.resumo||''),medidas:Array.isArray(r.medidas)?r.medidas.slice(0,6):[],materiais:Array.isArray(r.materiais)?r.materiais:[],complexidade:r.complexidade||{}};
    save();
  }catch(e){q.ai={erro:e?.code==='not_granted'?'A permissão para usar IA foi negada.':e?.code==='rate_limited'?'Muitas análises seguidas. Tente de novo em instantes.':'Não foi possível analisar as fotos agora.'}}
  render();
}

/* ===== 3D (carregado só quando o usuário abre) ===== */
let v3=null,v3Promise=null,v3Falha='',v3Peca='',v3Modo='';
function carregar3d(){
  if(!v3Promise)v3Promise=(async()=>{
    const m=await import('./viewer3d.js?v=30');
    v3Modo=m.webglModo();
    if(!v3Modo)throw new Error('webgl');
    try{v3=m.criarVisualizador({brilho:nav.brilho3d&&v3Modo!=='software',cotas:(mo,l)=>mo.cotasDe?mo.cotasDe(l):Model3D.cotas(mo,l)})}catch(e){throw new Error('webgl')}   // falha ao iniciar o WebGL não é falha de conexão
    v3.aoFalharContexto(conectado=>{                                       // só depois de 4 s sem recuperar
      if(v3)v3.destruir();v3=null;v3Promise=null;v3Peca='';                // descarta o visualizador morto: a próxima abertura cria outro
      if(conectado){nav.show3d=false;render();toast('O aparelho interrompeu o 3D. Toque em Ver em 3D para abrir de novo.')}
    });
    return v3;
  })().catch(e=>{
    v3Falha=e&&e.message==='webgl'?'Este aparelho não conseguiu iniciar o 3D. O desenho em 2D continua funcionando.':'Não foi possível carregar o 3D. Confira a conexão e tente de novo.';
    v3Promise=null;throw e;
  });
  return v3Promise;
}
/* 3D indisponível: some o que não serve (vistas, cotas, aparência, nota) e, se foi a conexão, oferece tentar de novo */
function falha3d(){
  const m=$('#v3dmsg');
  if(m){m.textContent=v3Falha;m.setAttribute('role','status');
    if(/conexão/.test(v3Falha))m.insertAdjacentHTML('beforeend','<div style="margin-top:10px"><button class="pri" data-act="retry3d">Tentar de novo</button></div>')}
  ['.bar3d','.row3d','#n3d'].forEach(s=>{const e=$(s);if(e)e.remove()});
  const box=$('#v3dbox');if(box){box.style.height='auto';box.style.minHeight='0'}
}
/* marca qual vista está ativa (aria-pressed), olhando os ângulos reais da câmera */
function marcarVista(){
  if(!v3)return;
  const e=v3.estado(),perto=(a,b)=>Math.abs(a-b)<0.01;
  const v=perto(e.pol,0)?'topo':(perto(e.pol,Math.PI/2)&&perto(e.az,0))?'frente':(perto(e.pol,1)&&perto(e.az,-0.6))?'persp':'';
  $$('[data-act="view3d"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
}
async function montar3d(){
  const q=curQ();if(!q||!$('#v3dbox'))return;
  if(nav.rolar3d){nav.rolar3d=false;$('#v3dbox').scrollIntoView({block:'start'})}   // ao abrir, leva o 3D para a vista (a barra de preço não o esconde)
  try{await carregar3d()}catch(e){falha3d();return}
  const box=$('#v3dbox');if(!nav.show3d||!box||curQ()!==q)return;      // a tela mudou enquanto carregava
  v3.anexar(box);const m=$('#v3dmsg');if(m)m.remove();
  box.addEventListener('pointerup',marcarVista);box.addEventListener('wheel',marcarVista,{passive:true});
  atualizar3d();
}
/* Aparência "Do material": granito, mármore e quartzo têm textura; o resto fica liso. Puramente visual. */
/* tom da pedra no 3D: só em "Do material", a partir do campo Cor do cadastro (aproximado; null = padrão) */
function fotoDe(q){return nav.tex3d==='material'?fotoDoMaterial(matOf(q)):null}
function corDe(q){return nav.tex3d==='material'?corDaPedra(matOf(q)?.color):null}
function texDe(q){
  if(nav.tex3d!=='material')return nav.tex3d;
  return {'Granito':'granito','Mármore':'marmore','Quartzo':'quartzo'}[matOf(q)?.cat]||'liso';
}
function modelo3d(q,p){
  const c=calc(q),sn=fechado(q)?q.snap:null;                           // chapa usada pelo plano de corte: as emendas saem da mesma conta
  const fixo=sn&&typeof sn.thick==='number'&&sn.SL>0&&sn.SW>0;          // fechado: chapa e espessura do fechamento, não do cadastro de hoje
  return Model3D.buildModel(p,{espessura:fixo?sn.thick:matOf(q)?.thick,SL:fixo?sn.SL:c.SL,SW:fixo?sn.SW:c.SW});
}
/* Cena do 3D: todas as peças do orçamento juntas. Cada uma continua com as próprias medidas e o próprio cálculo;
   a posição (p.pos, canto de trás à esquerda) é só de desenho e não entra em área, preço nem plano de corte. */
function layout3d(q,posNova){
  const itens=q.pieces.map((p,i)=>({p,modelo:modelo3d(q,p),nome:p.name||TYPES[p.type].nome}));
  const off=Model3D.arranjar(itens.map((it,i)=>({bp:it.modelo.bboxPeca,pos:posNova&&posNova.i===i?posNova.pos:it.p.pos})));
  return {itens:itens.map((it,i)=>({modelo:it.modelo,off:off[i],nome:it.nome})),off};
}
function nota3d(m){
  const el=$('#n3d');if(!el)return;
  const partes=['Cotas em cm, com as medidas da peça.',
    'Espessura '+nf(m.espessura,1)+' cm'+(m.espessuraOrigem==='padrao'?' (padrão: o material não tem espessura cadastrada).':' (do material).')];
  const qq=curQ();
  if(fechado(qq))partes.push(typeof qq.snap.thick==='number'&&qq.snap.SL>0?'Orçamento fechado: chapa e espessura do fechamento.':'Orçamento fechado antes desta versão: o 3D usa a chapa e a espessura do cadastro de hoje.');
  if(m.equipamentos.length&&nav.equip3d)partes.push('Cuba, torneira e cooktop são só ilustração: a forma, a profundidade da cuba e a posição da torneira não vêm de medida. Só o recorte tem medida.');
  if(m.emendasPlano>0)partes.push('Emendas do plano de corte em laranja: '+m.emendasPlano+(m.emendas.length!==m.emendasPlano?' (o desenho mostra '+m.emendas.length+' linhas de corte).':'.'));
  m.avisos.forEach(a=>partes.push(a));
  if(v3&&v3.gradeCm())partes.push('Grade de '+v3.gradeCm()+' cm.');
  if(v3Modo==='software')partes.push('Este aparelho está desenhando o 3D por software: pode ficar lento.');
  partes.push('Para conferência visual: não é desenho de fabricação'+(texDe(curQ())!=='liso'?'; a textura é ilustrativa: foto do material (ou tom do campo Cor), com escala aproximada; não mostra o veio da chapa que será cortada.':'.'));
  el.textContent=partes.join(' ');
}
function atualizar3d(){
  if(!v3||!nav.show3d||!$('#v3dbox'))return;
  const q=curQ(),p=q&&q.pieces[nav.pi];if(!p)return;
  const chave=q.id+':'+q.pieces.length,mantem=v3Peca===chave;v3Peca=chave;   // mesmo orçamento e mesmas peças: não reenquadra a câmera (trocar a peça selecionada não mexe na cena)
  const lay=layout3d(q),m=Model3D.comporCena(lay.itens,nav.pi);
  v3.editar(nav.ed3d&&nav.alcas3d&&!fechado(q),aoEditar3d);                // alças só no editor e fora de orçamento fechado
  v3.atualizar(m,mantem,{cotas:nav.cotas3d,textura:texDe(q),cor:corDe(q),foto:fotoDe(q),brilho:nav.brilho3d&&v3Modo!=='software',equip:nav.equip3d});
  nota3d(lay.itens[nav.pi].modelo);marcarVista();
}

const HIST={qid:null,pilha:[],i:-1,t:0,aplicando:false};
const snapEd=q=>JSON.stringify({p:q.pieces,m:q.materialId,c:q.params&&q.params.charge});
function histIniciar(q){HIST.qid=q.id;HIST.pilha=[snapEd(q)];HIST.i=0;HIST.t=0}
function histRegistrar(){
  if(!nav.ed3d||HIST.aplicando)return;
  const q=curQ();if(!q||q.id!==HIST.qid)return;
  const sn=snapEd(q);if(sn===HIST.pilha[HIST.i])return;
  const agora=Date.now();HIST.pilha.length=HIST.i+1;
  if(HIST.i>0&&agora-HIST.t<700)HIST.pilha[HIST.i]=sn;                        // digitação seguida vira um passo só
  else{HIST.pilha.push(sn);HIST.i++}
  HIST.t=agora;if(HIST.pilha.length>80){HIST.pilha.shift();HIST.i--}
  histUI();
}
function histUI(){
  const q=curQ(),trava=!q||fechado(q);
  $$('#ed3d [data-act="ed-desfazer"]').forEach(b=>b.disabled=trava||HIST.i<=0);
  $$('#ed3d [data-act="ed-refazer"]').forEach(b=>b.disabled=trava||HIST.i>=HIST.pilha.length-1);
}
function histIr(d){
  const q=curQ();if(!q||fechado(q)||!nav.ed3d)return;
  const j=HIST.i+d;if(j<0||j>=HIST.pilha.length)return;
  const o=JSON.parse(HIST.pilha[j]);HIST.i=j;HIST.t=0;
  q.pieces=o.p;q.materialId=o.m;if(q.params&&o.c)q.params.charge=o.c;
  if(nav.pi>=q.pieces.length)nav.pi=Math.max(0,q.pieces.length-1);

}

/* Alças do 3D: o visualizador mede o gesto; aqui o app grava na MESMA peça, valida e deixa preço/plano de corte recalcularem. */
function sincCampo(path,val){$$('#e3panel [data-b="'+path+'"]').forEach(el=>{if(document.activeElement!==el)el.value=val})}
function aoEditar3d(a){
  const q=curQ();if(!q||fechado(q)||!nav.ed3d)return false;
  const p=q.pieces[nav.pi];if(!p)return false;
  const PP=`quotes.${q.id}.pieces.${p.id}`;
  if(a.tipo==='fim'){save();render();return true}                       // grava uma vez, no fim do gesto
  if(a.tipo==='selecionar'){if(q.pieces[a.indice]){nav.pi=a.indice;render()}return true}
  if(a.tipo==='peca'){                                                    // mover a peça na cena (só desenho): não pode invadir outra peça
    const ret=(lay)=>lay.itens.map((it,i)=>({i,vazio:it.modelo.vazio,x:it.modelo.bboxPeca.min[0]+lay.off[i][0],z:it.modelo.bboxPeca.min[2]+lay.off[i][1],
      w:it.modelo.bboxPeca.max[0]-it.modelo.bboxPeca.min[0],d:it.modelo.bboxPeca.max[2]-it.modelo.bboxPeca.min[2]})).filter(r=>!r.vazio);
    const cruza=(rs)=>{const me=rs.find(r=>r.i===nav.pi);return me?rs.filter(r=>r.i!==nav.pi&&Model3D.sobrepoe([me,r])).length:0};
    const antes=cruza(ret(layout3d(q))),depois=cruza(ret(layout3d(q,{i:nav.pi,pos:{x:a.x,z:a.z}})));
    if(depois>antes)return false;                                         // peça por cima de outra: fica no último lugar válido
    p.pos={x:a.x,z:a.z};live();return true;
  }
  if(a.tipo==='campo'){
    const topo=a.campo==='saiaH'||a.campo==='rodaH';
    if(topo)p[a.campo]=a.valor;else{p.d=p.d||{};p.d[a.campo]=a.valor}
    sincCampo(PP+(topo?'.':'.d.')+a.campo,a.valor);
  }else if(a.tipo==='recorte'){
    const r=p.recortes&&p.recortes[a.indice];if(!r)return false;
    const ant={x:r.x,z:r.z,w:r.w,d:r.d},off=layout3d(q).off[nav.pi]||[0,0];        // o visualizador fala em coordenadas da cena; o recorte guarda as da peça
    r.x=a.x-off[0];r.z=a.z-off[1];r.w=a.w;r.d=a.d;
    const st=modelo3d(q,p).statusRecortes[a.indice];
    if(!st||!st.ok){Object.assign(r,ant);return false}                  // fora da bancada ou em cima de outro recorte: a alça para no último lugar válido
    ['x','z','w','d'].forEach(k=>sincCampo(`${PP}.recortes.${a.indice}.${k}`,r[k]));
  }
  live();return true;
}

    case 'sec':if(nav.sec!==v){nav.sec=v;nav.animar=true;render();scrollTo(0,0)}break;
    case 'qmode':nav.qmode=v;render();break;
    case 'move':{const x=S.quotes.find(o=>o.id===v);const i=STATUS.indexOf(x.status)+(+b.dataset.d);if(STATUS[i]){setStatus(x,STATUS[i]);render()}break}
    case 'piece':nav.pi=+v;nav.showTypes=false;render();break;
    case 'showtypes':nav.showTypes=!nav.showTypes;render();break;
    case 'toggle3d':nav.show3d=!nav.show3d;nav.rolar3d=nav.show3d;render();{const t=$('[data-act="toggle3d"]');if(t)t.focus({preventScroll:true})}break;   // render() refaz o HTML: devolve o foco ao botão
    case 'e3mat':{const m=S.materials.find(x=>x.id===v);if(m){q.materialId=m.id;q.params.charge=m.priceSlab>0?'chapa':'m2';save();render()}break}
    case 'e3cat':{const pd=CATALOGO.find(x=>x.nome===v);if(!pd)break;
      let m=S.materials.find(x=>normalizarNome(x.name)===normalizarNome(pd.nome));
      if(!m){m=materialDoCatalogo(pd,uid());S.materials.push(m)}
      q.materialId=m.id;q.params.charge=m.priceSlab>0?'chapa':'m2';save();render();
      if(materialSemPreco(m,q.params.charge))toast(pd.nome+' adicionada. Preencha o preço em Cadastros.');break}
    case 'ed-desfazer':histIr(-1);break;
    case 'ed-refazer':histIr(1);break;
    case 'ed-opcoes':{const m=$('#e3opcoes'),abre=m.hidden;m.hidden=!abre;b.setAttribute('aria-expanded',String(abre));break}
    case 'ed-enviar':fecharOpcoes();nav.sec='orc';fecharEd3d();scrollTo(0,0);break;
    case 'ed3d-abrir':abrirEd3d();break;
    case 'ed3d-sair':fecharEd3d();break;
    case 'e3menu':if(v===nav.e3m)nav.e3aberto=!nav.e3aberto;else{nav.e3m=v;nav.e3aberto=true}renderEd3d();if(v3&&nav.e3m==='mat')nota3d(modelo3d(q,q.pieces[nav.pi]));break;
    case 'retry3d':v3Promise=null;v3Falha='';render();break;
    case 'view3d':if(v3){v3.vista(v);marcarVista()}break;
    case 'enquadrar3d':if(v3)v3.enquadrar();break;
    case 'equip3d':nav.equip3d=!nav.equip3d;b.setAttribute('aria-pressed',nav.equip3d);if(v3)v3.opcoes({equip:nav.equip3d});{const q2=curQ(),p2=q2&&q2.pieces[nav.pi];if(p2)nota3d(modelo3d(q2,p2))}break;
    case 'brilho3d':nav.brilho3d=!nav.brilho3d;b.setAttribute('aria-pressed',nav.brilho3d);atualizar3d();break;
    case 'alcas3d':nav.alcas3d=!nav.alcas3d;b.setAttribute('aria-pressed',nav.alcas3d);atualizar3d();break;
    case 'cotas3d':nav.cotas3d=!nav.cotas3d;b.setAttribute('aria-pressed',nav.cotas3d);if(v3)v3.opcoes({cotas:nav.cotas3d});break;
    case 'addpiece':{const t=TYPES[v],d={};t.campos.forEach(([k,,def])=>d[k]=def);if(v==='livre')d.rects=[{w:100,h:50,q:1,l:'Peça'}];
      q.pieces.push({id:uid(),type:v,name:t.nome,d,saiaH:0,rodaH:0});nav.pi=q.pieces.length-1;nav.showTypes=false;save();render();break}
    case 'dup-piece':{const p=q.pieces.find(x=>x.id===v),n=JSON.parse(JSON.stringify(p));n.id=uid();n.name=(p.name||'Peça')+' (cópia)';delete n.pos;q.pieces.push(n);nav.pi=q.pieces.length-1;save();render();break}
    case 'del-piece':confirmTap(b,()=>{q.pieces=q.pieces.filter(x=>x.id!==v);nav.pi=0;save();render()});break;
    case 'add-rect':{const p=q.pieces[nav.pi];(p.d.rects=p.d.rects||[]).push({w:100,h:50,q:1,l:'Peça'});save();render();break}
    case 'del-rect':{q.pieces[nav.pi].d.rects.splice(+v,1);save();render();break}
    case 'add-recorte':{const p=q.pieces[nav.pi];(p.recortes=p.recortes||[]).push({id:uid(),tipo:'cuba',origem:'medido'});save();render();break}   // nasce vazio: nenhuma medida inventada
    case 'del-recorte':{const p=q.pieces[nav.pi];if(p.recortes)p.recortes.splice(+v,1);save();render();break}
    case 'del-line':q.lines.splice(+v,1);save();render();break;
    case 'passo':{const p=passoVizinho(v);if(p){nav.sec=p[0];nav.animar=true;render();scrollTo(0,0)}break}
    case 'cli-novo':nav.novoCli=!nav.novoCli;render();if(nav.novoCli){const n=$('#ncNome');if(n)n.focus()}break;
    case 'cli-salvar':{const nome=($('#ncNome').value||'').trim();if(!nome){toast('Digite o nome do cliente.');$('#ncNome').focus();break}
      const c={id:uid(),name:nome,phone:($('#ncFone').value||'').trim(),email:'',address:($('#ncEnd').value||'').trim(),notes:''};
      S.clients.unshift(c);q.clientId=c.id;nav.novoCli=false;save();render();toast('Cliente salvo e escolhido.');break}
    case 'quick-client':{const c={id:uid(),name:'Novo cliente',phone:'',email:'',address:'',notes:''};S.clients.unshift(c);q.clientId=c.id;save();nav.tab='cad';nav.cad='cli';nav.edit={kind:'clients',id:c.id};nav.qid=null;render();break}
    case 'del-quote':confirmTap(b,()=>{S.quotes=S.quotes.filter(x=>x.id!==v);nav.qid=null;save();render()});break;
    case 'addphoto':$('#filePhoto').click();break;
    case 'del-photo':q.photos.splice(+v,1);save();render();break;
    case 'ai':runAI(q);break;
    case 'ai-apply':{(q.ai.medidas||[]).forEach(m=>{const A=num(m.comprimento_cm),P=num(m.profundidade_cm);if(A>0&&P>0)q.pieces.push({id:uid(),type:'reta',name:String(m.peca||'Peça sugerida'),d:{A,P},saiaH:0,rodaH:0})});nav.sec='med';save();render();toast('Peças adicionadas. Confirme com a trena.');break}
    case 'pdf':if(calc(q).erro){toast('Corrija a margem e os impostos antes de gerar o PDF.');break}
      {const bt=b;bt.disabled=true;const sp=bt.querySelector('span');if(sp)sp.textContent='Gerando… (alguns segundos)';
       try{const bl=await buildPdf(q);nav.pdf={qid:q.id,hash:hashPdf(q),blob:bl,nome:nomeArquivoPdf(q)};toast('PDF pronto.')}
       catch(err){console.warn(err);toast('Não foi possível gerar o PDF.')}
       render()}break;
    case 'pdf-abrir':if(pdfPronto(q)){const u=URL.createObjectURL(nav.pdf.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}break;
    case 'pdf-baixar':if(pdfPronto(q))await saveFile(nav.pdf.nome,nav.pdf.blob);break;
    case 'pdf-wa':if(!pdfPronto(q))break;{
      const arq=new File([nav.pdf.blob],nav.pdf.nome,{type:'application/pdf'}),texto=waTexto(q);
      if(navigator.canShare&&navigator.canShare({files:[arq]})){
        try{await navigator.share({files:[arq],text:texto,title:'Orçamento #'+q.num});break}catch(err){if(err&&err.name==='AbortError')break}   // cancelou: nada a fazer; outro erro: cai no plano B
      }
      await saveFile(nav.pdf.nome,nav.pdf.blob);let d=((clientOf(q)||{}).phone||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;
      window.open(`https://wa.me/${d}?text=${encodeURIComponent(texto)}`,'_blank','noopener');toast('PDF baixado. Anexe na conversa do WhatsApp.');
    }break;
    case 'mark-sent':setStatus(q,'Enviado');render();toast('Marcado como enviado.');break;
    case 'cad':nav.cad=v;nav.catAberto=false;render();break;
    case 'cat-abrir':nav.catAberto=true;nav.catQ='';nav.catCat='todas';nav.catSel=[];render();scrollTo(0,0);break;
    case 'cat-fechar':nav.catAberto=false;render();break;
    case 'cat-filtro':nav.catCat=v;render();break;
    case 'cat-toggle':{const i=nav.catSel.indexOf(v);if(i>=0)nav.catSel.splice(i,1);else nav.catSel.push(v);
      b.setAttribute('aria-pressed',String(i<0));const l=$('#catlista');if(l)l.innerHTML=linhasCatalogo();
      const n=nav.catSel.length;$('#catn').textContent=n?n+' selecionada'+(n===1?'':'s'):'Toque nas pedras que você trabalha';$('#catadd').disabled=!n;break}
    case 'cat-add':{
      const novas=CATALOGO.filter(p=>nav.catSel.includes(p.nome)&&!jaCadastrada(S.materials,p.nome));
      novas.forEach(p=>S.materials.push(materialDoCatalogo(p,uid())));
      nav.catAberto=false;nav.catSel=[];if(novas.length)save();render();
      toast(novas.length?novas.length+' pedra'+(novas.length===1?'':'s')+' adicionada'+(novas.length===1?'':'s')+'. Preencha preço e chapa de cada uma.':'Essas pedras já estavam cadastradas.');break}
    case 'add-cad':{const k=nav.cad;let o;
      if(k==='mat'){o={id:uid(),name:'Nova pedra',cat:'Granito',color:'',thick:2,priceSlab:0,priceM2:0,slabL:300,slabW:160,supplier:'',stock:0,photo:''};S.materials.unshift(o);nav.edit={kind:'materials',id:o.id}}
      else if(k==='svc'){o={id:uid(),name:'Novo serviço',cat:'Acabamentos',unit:'un',price:0};S.services.unshift(o);nav.edit={kind:'services',id:o.id}}
      else{o={id:uid(),name:'Novo cliente',phone:'',email:'',address:'',notes:''};S.clients.unshift(o);nav.edit={kind:'clients',id:o.id}}
      save();render();scrollTo(0,0);break}
    case 'edit':nav.edit={kind:b.dataset.k,id:v};render();scrollTo(0,0);break;
    case 'edit-close':nav.edit=null;render();break;
    case 'del-cad':confirmTap(b,()=>{const {kind,id}=nav.edit;S[kind]=S[kind].filter(x=>x.id!==id);nav.edit=null;save();render()});break;
    case 'logo':$('#fileLogo').click();break;
    case 'logo-del':S.settings.logo='';save();render();break;
    case 'mat-photo':pendingMat=v;$('#fileMat').click();break;
    case 'mat-photo-del':S.materials.find(x=>x.id===v).photo='';save();render();break;
    case 'theme':S.settings.theme=v;applyTheme();save();render();break;
    case 'export':saveFile(`marmofacil-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S));break;
    case 'import':$('#fileImport').click();break;
    case 'clear-ex':confirmTap(b,()=>{['materials','services','clients','quotes'].forEach(k=>S[k]=S[k].filter(x=>!x.ex));save();render();toast('Exemplos removidos.')});break;
    case 'reset':confirmTap(b,()=>{S={materials:[],services:[],clients:[],quotes:[],settings:{...S.settings,nextNum:1001}};save();nav.qid=null;nav.edit=null;render();toast('Tudo apagado.')});break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card.tap')){e.preventDefault();e.target.click()}});

/* Atualização ao vivo: não recria os campos para não perder o foco */
function live(){
  if(nav.tab==='amb'&&nav.amb){liveAmb();return}
  const q=curQ();if(!q)return;
  const sb=$('#sumbar');if(sb)sb.outerHTML=sumBar(q);
  if(nav.sec==='med'){const p=q.pieces[nav.pi];if(p&&$('#pdraw')){$('#pdraw').innerHTML=drawPiece(p);$('#parea').textContent=nf(partsArea(shape(p).parts))+' m²'}const ri=$('#rcinfo');if(ri&&p){ri.innerHTML=rcInfo(q,p);const mr=rcModelo(q,p);(p.recortes||[]).forEach((r,i)=>{const e=$('#rcs'+i);if(e)e.innerHTML=rcStatus(mr.statusRecortes[i])})}atualizar3d();if(nav.ed3d)e3resumo(q)}
  if(nav.sec==='svc'){q.lines.forEach((l,i)=>{const s=S.services.find(x=>x.id===l.svcId),el=$('#ls'+i);if(el&&s)el.textContent=brl(s.price*l.qty)});const c=calc(q);$('#svcsub').textContent=brl(c.svc)}
  if(nav.sec==='cal'){const t=document.createElement('template');t.innerHTML=secCal(q);
    ['#calcbox','#aprov','#plano'].forEach(id=>{const n=t.content.querySelector(id),o=$(id);if(n&&o)o.innerHTML=n.innerHTML})}
}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-b]');if(!el||el.tagName==='SELECT')return;
  if(fechado(curQ())&&el.closest('#secbody,#e3panel'))return;
  const old=getPath(el.dataset.b);
  const val=el.dataset.t==='n'?num(el.value):el.value;
  setPath(el.dataset.b,val);save();
  const cond=/\.(saiaH|rodaH)$/.test(el.dataset.b)&&((old>0)!==(val>0));
  if(cond){const path=el.dataset.b;render();const n=$(`[data-b="${path}"]`);if(n){n.focus();const L=n.value.length;try{n.setSelectionRange(L,L)}catch(x){}}}
  else live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='tex3d'){nav.tex3d=el.value;atualizar3d();return}                 // só visual: vale também em orçamento fechado
  if(fechado(curQ())&&el.closest('#secbody,#e3panel'))return;
  if(el.id==='addSvc'){const q=curQ();if(el.value){const f=q.lines.find(l=>l.svcId===el.value);if(f)f.qty+=1;else q.lines.push({svcId:el.value,qty:1});save();render()}return}
  if(el.matches('select[data-b]')&&el.dataset.b.endsWith('.status')){const q2=curQ();if(q2)setStatus(q2,el.value);render();return}
  if(el.matches('select[data-b]')){setPath(el.dataset.b,el.dataset.t==='n'?num(el.value):el.value);
    const q=curQ();if(q&&/\.materialId$/.test(el.dataset.b)){const m=matOf(q);if(m)q.params.charge=m.priceSlab>0?'chapa':'m2'}
    save();render();return}
  if(el.id==='filePhoto'&&el.files[0]){const q=curQ();readImg(el.files[0]).then(u=>{q.photos.push(u);save();render();toast('Foto salva no orçamento.')}).catch(()=>toast('Não foi possível ler a foto.'));el.value='';return}
  if(el.id==='fileLogo'&&el.files[0]){readImg(el.files[0],360).then(u=>{S.settings.logo=u;save();render();toast('Logo salvo.')}).catch(()=>toast('Não foi possível ler a imagem.'));el.value='';return}
  if(el.id==='fileMat'&&el.files[0]&&pendingMat){const m=S.materials.find(x=>x.id===pendingMat);readImg(el.files[0],600).then(u=>{m.photo=u;save();render()}).catch(()=>toast('Não foi possível ler a foto.'));el.value='';return}
  if(el.id==='fileImport'&&el.files[0]){
    el.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.quotes)||!Array.isArray(d.materials))throw 0;S=d;garantirSnapshots();save();applyTheme();nav.qid=null;nav.edit=null;render();toast('Backup restaurado.')}catch(x){toast('Arquivo de backup inválido.')}});el.value='';
  }
});

/* ===== Início ===== */
load();garantirSnapshots();applyTheme();aplicarLayout();render();
if(window.pfAbriu)window.pfAbriu();

/* Aviso de nova versão: o app abre da cópia guardada; quando uma versão nova assume, oferece recarregar. */
function avisoAtualizar(){
  if($('#upd'))return;
  const e=document.createElement('div');e.id='upd';e.className='upd';e.setAttribute('role','status');
  e.innerHTML='<span>Nova versão disponível.</span><button class="pri" data-act="atualizar">Atualizar</button>';
  document.body.appendChild(e);
}
if('serviceWorker' in navigator){
  const tinhaControle=!!navigator.serviceWorker.controller;           // primeira instalação não avisa
  navigator.serviceWorker.addEventListener('controllerchange',async()=>{if(!tinhaControle)return;try{const k=await versoesEmCache();if(k.length&&k[k.length-1]>APP_V)avisoAtualizar()}catch(e){avisoAtualizar()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.update().catch(()=>{});                                       // procura versão nova a cada abertura
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
</script>
