<script>
/* Rede de segurança de abertura. Se o app não conseguir abrir (por exemplo, arquivos de versões diferentes
   no cache do celular), limpa SÓ o cache do app e tenta de novo uma vez; se ainda falhar, mostra uma tela
   com saída. Nunca apaga nem altera os dados salvos (localStorage). */
(function(){
  const FLAG='pf-cura';let mostrou=false;
  const aberto=()=>!!document.querySelector('#tabs button');
  const jaTentou=()=>{try{return sessionStorage.getItem(FLAG)==='1'}catch(e){return window.name===FLAG}};
  const marcar=()=>{try{sessionStorage.setItem(FLAG,'1')}catch(e){window.name=FLAG}};
  window.pfAbriu=()=>{try{sessionStorage.removeItem(FLAG)}catch(e){}if(window.name===FLAG)window.name=''};
  async function curar(){
    try{const k=await caches.keys();await Promise.all(k.filter(x=>/^(marmofacil|pedra-facil)-/.test(x)).map(x=>caches.delete(x)))}catch(e){}
    try{const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}catch(e){}
    try{await Promise.all([location.href,...[...document.scripts].map(x=>x.src).filter(Boolean)].map(u=>fetch(u,{cache:'reload'})))}catch(e){}   // baixa de novo, ignorando o cache do navegador
    location.reload();
  }
  function baixarDados(){
    let t='';try{t=localStorage.getItem('pedrafacil.v1')||''}catch(e){}
    if(!t){alert('Não há dados salvos neste endereço.');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));
    a.download='marmofacil-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  }
  function tela(msg){
    if(mostrou)return;const d=document.getElementById('app');if(!d)return;mostrou=true;
    d.innerHTML='<div class="stack" style="padding-top:24px"><h1>O app não conseguiu abrir</h1>'+
      '<div class="card stack"><div>Seus dados continuam guardados neste aparelho. Toque em <b>Tentar de novo</b>. Se não resolver, baixe uma cópia dos dados antes de qualquer outra coisa.</div>'+
      '<button class="pri" id="pfTentar">Tentar de novo</button><button id="pfBaixar">Baixar cópia dos meus dados</button></div>'+
      '<div class="small muted">Detalhe técnico para suporte:</div><pre class="small" id="pfMsg" style="white-space:pre-wrap;word-break:break-word"></pre></div>';
    document.getElementById('pfMsg').textContent=msg;
    document.getElementById('pfTentar').onclick=curar;document.getElementById('pfBaixar').onclick=baixarDados;
  }
  function falhou(msg){
    setTimeout(()=>{
      if(aberto())return;
      if(!jaTentou()){marcar();curar();return}
      tela(msg);
    },50);
  }
  addEventListener('error',e=>{
    const t=e.target;if(t&&t!==window&&t.tagName!=='SCRIPT')return;            // fontes e imagens não contam
    falhou((e.message||('Não carregou '+(t&&t.src)))+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''));
  },true);
})();
</script>

<script>
/* ===== Utilidades ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const nf=(n,d=2)=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>nf((n||0)*100,1)+'%';
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const STATUS=['Rascunho','Enviado','Negociação','Fechado','Perdido'];
const KEY='pedrafacil.v1';
const APP_V=6;                                   // igual a V em sw.js e aos ?v= dos scripts (tests/versao.test.js confere)

/* ===== Tipos de peça: campos de medida em cm ===== */
const TYPES={
  reta:{nome:'Reta',campos:[['A','Comprimento',280],['P','Profundidade',60]]},
  L:{nome:'Em L',campos:[['A','Lado A (total)',300],['B','Lado B (total)',200],['P','Profundidade',60]]},
  U:{nome:'Em U',campos:[['A','Fundo (total)',320],['B','Lateral esq. (total)',220],['C','Lateral dir. (total)',220],['P','Profundidade',60]]},
  ilha:{nome:'Ilha',campos:[['A','Comprimento',240],['B','Largura',100]]},
  escada:{nome:'Escada',campos:[['A','Largura',100],['N','Degraus',5],['PI','Piso',30],['ES','Espelho',17]]},
  nicho:{nome:'Nicho',campos:[['A','Largura',80],['H','Altura',60],['P','Profundidade',25]]},
  lavatorio:{nome:'Lavatório',campos:[['A','Comprimento',120],['P','Profundidade',55]]},
  livre:{nome:'Livre',campos:[]}
};

/* Geometria, plano de corte e preço vivem em calc.js (funções puras, com testes em tests/). */
/* ===== Cálculo do orçamento ===== */
function matOf(q){return S.materials.find(m=>m.id===q.materialId)}
function calc(q){return aplicarSnapshot(calcQuote(q,S.materials,S.services),q.snap)}
const fechado=q=>!!q&&q.status==='Fechado'&&!!q.snap;

/* ===== Dados iniciais (exemplos) ===== */
function seed(){
  const mats=[
    {name:'Preto São Gabriel',cat:'Granito',color:'Preto',thick:2,priceSlab:2900,priceM2:640,slabL:310,slabW:180,supplier:'Pedreira Serra Alta',stock:6},
    {name:'Branco Prime',cat:'Quartzo',color:'Branco',thick:2,priceSlab:6800,priceM2:1180,slabL:320,slabW:160,supplier:'Quartz Brasil',stock:3},
    {name:'Taj Mahal',cat:'Quartzito',color:'Bege claro',thick:2,priceSlab:11500,priceM2:2050,slabL:310,slabW:190,supplier:'Importadora Litos',stock:2},
    {name:'Carrara',cat:'Mármore',color:'Branco veiado',thick:2,priceSlab:7400,priceM2:1480,slabL:300,slabW:180,supplier:'Importadora Litos',stock:1},
    {name:'Porcelanato Calacatta',cat:'Porcelanato',color:'Branco veiado',thick:1,priceSlab:1650,priceM2:420,slabL:300,slabW:150,supplier:'Cerâmica Norte',stock:8}
  ].map(x=>({...x,id:uid(),photo:'',ex:true}));
  const svcs=[
    ['Furo de torneira','Furos','un',30],['Recorte de cuba de embutir','Recortes','un',140],['Recorte de cooktop','Recortes','un',190],
    ['Cuba inox instalada','Cubas','un',380],['Pingadeira','Acabamentos','ml',45],['Meia-esquadria','Acabamentos','ml',70],
    ['Borda reta polida','Acabamentos','ml',35],['Rodabanca colada','Rodabanca','ml',28],['Saia colada','Saia','ml',55]
  ].map(a=>({id:uid(),name:a[0],cat:a[1],unit:a[2],price:a[3],ex:true}));
  const cls=[
    {name:'Marina Alves',phone:'11 98877-1234',email:'marina@exemplo.com',address:'Rua das Acácias, 120 - Moema',notes:'Cozinha nova, prazo até dezembro.'},
    {name:'Carlos Mendes',phone:'11 97766-4321',email:'carlos@exemplo.com',address:'Av. Paulista, 900, ap 71',notes:'Banheiro social.'}
  ].map(x=>({...x,id:uid(),ex:true}));
  const par=()=>({margin:35,tax:6,moM2:180,instalM2:90,instalFixo:0,frete:150,charge:'chapa',lossPct:12});
  const mk=(c,mi,st,pieces,lines,daysAgo)=>({id:uid(),num:0,clientId:cls[c].id,materialId:mats[mi].id,status:st,pieces,lines,
    params:par(),photos:[],notes:'',validade:15,createdAt:Date.now()-daysAgo*864e5,closedAt:st==='Fechado'?Date.now()-(daysAgo-2)*864e5:null,ex:true});
  const pc=(type,name,d,extra={})=>({id:uid(),type,name,d,saiaH:0,rodaH:0,...extra});
  const sv=n=>S0svc(svcs,n);
  const quotes=[
    mk(0,1,'Fechado',[pc('L','Bancada da cozinha',{A:310,B:210,P:62},{rodaH:7})],[{svcId:svcs[1].id,qty:1},{svcId:svcs[2].id,qty:1},{svcId:svcs[0].id,qty:1}],20),
    mk(1,3,'Enviado',[pc('lavatorio','Lavatório do social',{A:120,P:52},{saiaH:5})],[{svcId:svcs[1].id,qty:1},{svcId:svcs[0].id,qty:1}],5),
    mk(0,0,'Negociação',[pc('reta','Bancada da área gourmet',{A:260,P:65},{rodaH:7}),pc('ilha','Ilha',{A:200,B:90},{saiaH:6})],[{svcId:svcs[2].id,qty:1}],9)
  ];
  quotes[1].params.charge='m2';
  quotes.forEach((q,i)=>q.num=1001+i);
  return {materials:mats,services:svcs,clients:cls,quotes,
    settings:{empresa:'Sua Marmoraria',telefone:'',margin:35,tax:6,moM2:180,instalM2:90,frete:150,validade:15,nextNum:1004,theme:'auto'}};
}
function S0svc(){return null}

let S=null;
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return}}catch(e){}
  S=seed();
}
let saveTimer=0,saveWarned=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S))}
    catch(e){if(!saveWarned){saveWarned=true;toast('Memória do navegador cheia. Exporte um backup e remova fotos.')}}
  },250);
}
/* ===== Desenho SVG (cotas em cm, escala automática) ===== */
function drawPiece(p){
  const {rects}=shape(p);
  if(!rects.length)return '<div class="muted small" style="padding:24px;text-align:center">Adicione medidas para ver o desenho.</div>';
  const pad=34;
  const W=Math.max(...rects.map(a=>a.x+a.w)),H=Math.max(...rects.map(a=>a.y+a.h));
  const sc=Math.min(560/Math.max(W,1),300/Math.max(H,1));
  const vw=W*sc+pad*2,vh=H*sc+pad*2;
  let s=`<svg viewBox="0 0 ${vw.toFixed(0)} ${vh.toFixed(0)}" role="img" aria-label="Desenho de ${esc(p.name)}">`;
  rects.forEach(a=>{
    const x=pad+a.x*sc,y=pad+a.y*sc,w=a.w*sc,h=a.h*sc;
    const fill=a.kind==='extra'?'color-mix(in srgb,var(--accent) 22%,var(--surface))':a.kind==='riser'?'var(--surface2)':'var(--accent-soft)';
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="var(--accent)" stroke-width="1.5"/>`;
    if(w>46&&h>16)s+=`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle">${esc(a.l)} ${nf(a.w,0)}×${nf(a.h,0)}</text>`;
  });
  /* cotas gerais */
  s+=`<g stroke="var(--muted)" stroke-width="1" fill="none"><path d="M${pad} ${pad-14}H${pad+W*sc}M${pad} ${pad-19}v10M${pad+W*sc} ${pad-19}v10"/>`;
  s+=`<path d="M${pad-14} ${pad}V${pad+H*sc}M${pad-19} ${pad}h10M${pad-19} ${pad+H*sc}h10"/></g>`;
  s+=`<text x="${pad+W*sc/2}" y="${pad-20}" text-anchor="middle">${nf(W,0)} cm</text>`;
  s+=`<text transform="translate(${pad-20} ${pad+H*sc/2}) rotate(-90)" text-anchor="middle">${nf(H,0)} cm</text></svg>`;
  return s;
}

/* Plano de corte da chapa */
function drawSlabs(c){
  const {SL,SW,nest}=c;
  if(!nest.slabs.length)return '';
  const sc=300/SL,gap=14;
  let out='';
  nest.slabs.forEach((sl,i)=>{
    const used=sl.items.reduce((t,a)=>t+a.w*a.h,0)/1e4;
    out+=`<div class="draw"><div class="row between small" style="padding:2px 4px 6px"><b>Chapa ${i+1}</b><span class="mono muted">${nf(used/c.slabArea*100,0)}% usada</span></div>`;
    out+=`<svg viewBox="0 0 ${SL*sc+2} ${SW*sc+2}" role="img" aria-label="Chapa ${i+1}"><rect x="1" y="1" width="${SL*sc}" height="${SW*sc}" fill="var(--slab)" stroke="var(--slab-line)" stroke-width="1.5"/>`;
    sl.items.forEach(a=>{
      const w=a.w*sc,h=a.h*sc;
      out+=`<rect x="${1+a.x*sc}" y="${1+a.y*sc}" width="${w}" height="${h}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>`;
      if(w>40&&h>12)out+=`<text x="${1+a.x*sc+w/2}" y="${1+a.y*sc+h/2+4}" text-anchor="middle" style="font-size:9px">${nf(a.w,0)}×${nf(a.h,0)}</text>`;
    });
    out+='</svg></div>';
  });
  return out;
}

/* Fechar congela os valores (q.snap); qualquer outra etapa descongela. Devolve false se não puder fechar. */
function setStatus(q,st){
  if(st==='Fechado'){
    if(q.status!=='Fechado'||!q.snap){
      const c=calcQuote(q,S.materials,S.services);
      if(c.erro){toast(c.erro);return false}
      q.snap=snapshotOf(c,Date.now());
    }
    if(q.status!=='Fechado')q.closedAt=Date.now();
  }else{delete q.snap;q.closedAt=null}
  q.status=st;save();return true;
}
/* Orçamentos fechados antes desta versão (ou de backups antigos) ganham o snapshot com os valores de hoje. */
function garantirSnapshots(){
  let mudou=false;
  S.quotes.forEach(q=>{if(q.status==='Fechado'&&!q.snap){q.snap=snapshotOf(calcQuote(q,S.materials,S.services),Date.now());q.snap.migrado=true;mudou=true}});
  if(mudou)save();
}

    <div class="row" style="align-items:flex-end;height:110px;margin-top:10px;gap:12px">
     ${meses.map(m=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end">

/* ===== Campos ligados ao estado ===== */
const step=(o,k)=>Array.isArray(o)?(/^\d+$/.test(k)?o[+k]:o.find(x=>x.id===k)):o[k];
function getPath(path){let o=S;for(const k of path.split('.')){if(o==null)return;o=step(o,k)}return o}
function setPath(path,val){const ks=path.split('.'),last=ks.pop();let o=S;for(const k of ks){o=step(o,k);if(o==null)return}o[last]=val}
function fld(label,path,type='t',opt={}){
  const v=getPath(path);
  const inp=type==='n'?`<input type="number" inputmode="decimal" step="${opt.step||'any'}" min="${opt.min??0}" value="${v??''}" data-b="${path}" data-t="n">`
   :type==='area'?`<textarea data-b="${path}" data-t="t">${esc(v)}</textarea>`
   :`<input type="${opt.kind||'text'}" value="${esc(v)}" data-b="${path}" data-t="t" ${opt.ph?`placeholder="${esc(opt.ph)}"`:''}>`;
  return `<label class="f">${label}${opt.unit?` <span style="font-weight:500">(${opt.unit})</span>`:''}${inp}</label>`;
}
function sel(label,path,options,opt={}){
  const v=getPath(path)??'';
  return `<label class="f">${label}<select data-b="${path}" data-t="${opt.n?'n':'t'}" ${opt.full?'data-full="1"':''}>${opt.blank?`<option value="">${opt.blank}</option>`:''}${options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
}

/* ===== Utilitários de arquivo e foto ===== */
function readImg(file,max=1000){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onerror=no;
    fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',0.72))};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function dataUrlBlob(u){const [h,b]=u.split(',');const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.match(/:(.*?);/)[1]})}
async function saveFile(filename,data){
  const dl=await (window.claude?.use?window.claude.use('downloads'):null);
  if(!dl){const bl=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo baixado.');return}
  try{await dl.save({filename,data});toast('Arquivo pronto.')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível salvar o arquivo.')}
}

function buildPdf(q){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const {c,cl,items,svcs}=quoteData(q),s=S.settings,W=210,M=16;let y=18;
  const need=h=>{if(y+h>285){doc.addPage();y=18}};
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.text(s.empresa||'Marmoraria',M,y);
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(90);
  if(s.telefone)doc.text(s.telefone,M,y+6);
  doc.setTextColor(0);doc.setFont('helvetica','bold');doc.text('Orçamento #'+q.num,W-M,y,{align:'right'});
  doc.setFont('helvetica','normal');doc.setTextColor(90);
  doc.text(dateBR(q.createdAt)+'  |  válido por '+q.validade+' dias',W-M,y+6,{align:'right'});doc.setTextColor(0);
  y+=16;doc.setDrawColor(200);doc.line(M,y,W-M,y);y+=8;
  doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(cl.name||'Cliente não informado',M,y);y+=5.5;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  [cl.phone,cl.email,cl.address].filter(Boolean).forEach(t=>{doc.text(t,M,y);y+=5});
  y+=3;doc.setFont('helvetica','bold');doc.text('Material',M,y);doc.setFont('helvetica','normal');
  doc.text(c.m?`${c.m.name} (${c.m.cat}, ${nf(c.m.thick,0)} cm)`:'a definir',M+22,y);y+=9;
  doc.setFillColor(238,240,239);doc.rect(M,y-5,W-2*M,7,'F');doc.setFont('helvetica','bold');
  doc.text('Item',M+2,y);doc.text('Área',W-M-2,y,{align:'right'});y+=7;doc.setFont('helvetica','normal');
  items.forEach(i=>{
    const t=doc.splitTextToSize(i.desc+(i.extra?' - '+i.extra:''),W-2*M-40);need(8+t.length*4.5);
    doc.setFont('helvetica','bold');doc.text(i.nome,M+2,y);doc.setFont('helvetica','normal');doc.text(nf(i.area)+' m²',W-M-2,y,{align:'right'});
    y+=4.8;doc.setTextColor(90);doc.setFontSize(9);doc.text(t,M+2,y);y+=t.length*4.2+2.5;doc.setTextColor(0);doc.setFontSize(10)});
  svcs.forEach(i=>{need(7);doc.text(i.nome,M+2,y);doc.text(nf(i.qtd,i.qtd%1?1:0)+' '+i.un,W-M-2,y,{align:'right'});y+=6});
  need(7);doc.text('Instalação'+(c.frete?' e frete':''),M+2,y);doc.text('incluso',W-M-2,y,{align:'right'});y+=8;
  need(20);doc.setDrawColor(20);doc.setLineWidth(0.6);doc.line(M,y,W-M,y);y+=8;
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Total',M+2,y);doc.setFontSize(16);doc.text(brl(c.price),W-M-2,y,{align:'right'});y+=10;
  if(q.notes){doc.setFont('helvetica','normal');doc.setFontSize(10);const t=doc.splitTextToSize(q.notes,W-2*M);need(t.length*5);doc.text(t,M,y);y+=t.length*5+4}
  const ph=q.photos.slice(0,3);
  if(ph.length){need(52);ph.forEach((f,i)=>{try{doc.addImage(f,'JPEG',M+i*58,y,54,40)}catch(e){}});y+=46}
  doc.setFontSize(8);doc.setTextColor(120);doc.text('Valores sujeitos a conferência das medidas no local.',M,288);
  return doc.output('blob');
}

/* ===== WhatsApp ===== */
function waUrl(q){
  const {c,cl,items}=quoteData(q),s=S.settings;
  let t=`Olá${cl.name?', '+cl.name.split(' ')[0]:''}! Segue o orçamento #${q.num} da ${s.empresa}.\n\n`;
  t+=`Material: ${c.m?c.m.name:'a definir'}\n`;
  items.forEach(i=>{t+=`• ${i.nome}: ${nf(i.area)} m²\n`});
  t+=`\nTotal: ${brl(c.price)}\nValidade: ${q.validade} dias.`;
  let d=(cl.phone||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;
  return `https://wa.me/${d}?text=${encodeURIComponent(t)}`;
}

/* ===== IA: leitura das fotos ===== */
async function runAI(q){
  const btn=$('#aiBtn'),out=$('#aiOut');
  const sample=await (window.claude?.use?window.claude.use('sample'):null);
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim?.images){out.innerHTML=aiHtml({erro:'A leitura de fotos por IA não está disponível nesta visualização.'});return}
  btn.disabled=true;btn.textContent='Analisando...';
  const blobs=q.photos.slice(0,3).map(dataUrlBlob);
  const prompt=`Você é um orçador experiente de marmoraria. As imagens são fotos do ambiente onde será instalada uma peça de pedra (bancada, lavatório, escada, nicho ou similar).
Use referências de escala visíveis (portas ~210 cm de altura, bancadas ~90 cm de altura e 55-65 cm de profundidade, azulejos, eletrodomésticos) para estimar medidas. Se não houver referência, diga isso no resumo e dê faixas conservadoras.
Materiais disponíveis na loja: ${S.materials.map(m=>m.name+' ('+m.cat+')').join('; ')||'nenhum cadastrado'}.
Responda somente com JSON neste formato, em português do Brasil:
{"resumo":"2 frases sobre o ambiente","medidas":[{"peca":"nome","comprimento_cm":0,"profundidade_cm":0}],"materiais":["até 3 nomes, priorizando os da loja"],"complexidade":{"nivel":"Baixa|Média|Alta","motivo":"1 frase"}}`;
  try{
    const r=await sample.json(prompt,{images:blobs,cache:false});
    q.ai={resumo:String(r.resumo||''),medidas:Array.isArray(r.medidas)?r.medidas.slice(0,6):[],materiais:Array.isArray(r.materiais)?r.materiais:[],complexidade:r.complexidade||{}};
    save();
  }catch(e){q.ai={erro:e?.code==='not_granted'?'A permissão para usar IA foi negada.':e?.code==='rate_limited'?'Muitas análises seguidas. Tente de novo em instantes.':'Não foi possível analisar as fotos agora.'}}
  render();
}

/* ===== 3D (carregado só quando o usuário abre) ===== */
let v3=null,v3Promise=null,v3Falha='',v3Peca='';
function carregar3d(){
  if(!v3Promise)v3Promise=(async()=>{
    const m=await import('./viewer3d.js?v=6');
    if(!m.webglDisponivel())throw new Error('webgl');
    v3=m.criarVisualizador();
    v3.aoPerderContexto(()=>{nav.show3d=false;render();toast('O aparelho interrompeu o 3D. Toque em Ver em 3D para abrir de novo.')});
    return v3;
  })().catch(e=>{
    v3Falha=e&&e.message==='webgl'?'Este aparelho não conseguiu iniciar o 3D. O desenho em 2D continua funcionando.':'Não foi possível carregar o 3D. Confira a conexão e tente de novo.';
    v3Promise=null;throw e;
  });
  return v3Promise;
}
async function montar3d(){
  const q=curQ();if(!q||!$('#v3dbox'))return;
  try{await carregar3d()}catch(e){const m=$('#v3dmsg');if(m)m.textContent=v3Falha;return}
  const box=$('#v3dbox');if(!nav.show3d||!box||curQ()!==q)return;      // a tela mudou enquanto carregava
  v3.anexar(box);const m=$('#v3dmsg');if(m)m.remove();
  atualizar3d();
}
function atualizar3d(){
  if(!v3||!nav.show3d||!$('#v3dbox'))return;
  const q=curQ(),p=q&&q.pieces[nav.pi];if(!p)return;
  const mantem=v3Peca===p.id;v3Peca=p.id;                              // mesma peça: não reenquadra a câmera
  v3.definirModelo(Model3D.buildModel(p,matOf(q)?.thick),mantem);
}

/* ===== Eventos ===== */
const curQ=()=>nav.qid&&S.quotes.find(x=>x.id===nav.qid);
function confirmTap(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';btn.dataset.txt=btn.textContent;btn.textContent='Toque de novo para confirmar';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=btn.dataset.txt}},3000);
}
let pendingMat=null;
const EDITA=new Set(['addpiece','dup-piece','del-piece','add-rect','del-rect','del-line','quick-client','del-quote','addphoto','del-photo','ai','ai-apply','mark-sent']);
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,q=curQ();
  if(fechado(q)&&EDITA.has(a)){toast('Orçamento fechado. Toque em Reabrir para editar.');return}
  switch(a){
    case 'reopen':confirmTap(b,()=>{setStatus(q,'Negociação');render();toast('Reaberto. O preço agora usa os valores atuais do cadastro.')});break;
    case 'atualizar':location.reload();break;
    case 'tab':if(v==='new'){const n=newQuote();openQuote(n.id,'cli')}else goTab(v);break;
    case 'newq':{const n=newQuote();openQuote(n.id,'cli');break}
    case 'open':openQuote(v);break;
    case 'close':nav.qid=null;render();break;
    case 'sec':nav.sec=v;render();break;
    case 'qmode':nav.qmode=v;render();break;
    case 'move':{const x=S.quotes.find(o=>o.id===v);const i=STATUS.indexOf(x.status)+(+b.dataset.d);if(STATUS[i]){setStatus(x,STATUS[i]);render()}break}
    case 'piece':nav.pi=+v;nav.showTypes=false;render();break;
    case 'showtypes':nav.showTypes=!nav.showTypes;render();break;
    case 'toggle3d':nav.show3d=!nav.show3d;render();break;
    case 'view3d':if(v3)v3.vista(v);break;
    case 'addpiece':{const t=TYPES[v],d={};t.campos.forEach(([k,,def])=>d[k]=def);if(v==='livre')d.rects=[{w:100,h:50,q:1,l:'Peça'}];
      q.pieces.push({id:uid(),type:v,name:t.nome,d,saiaH:0,rodaH:0});nav.pi=q.pieces.length-1;nav.showTypes=false;save();render();break}
    case 'dup-piece':{const p=q.pieces.find(x=>x.id===v),n=JSON.parse(JSON.stringify(p));n.id=uid();n.name=(p.name||'Peça')+' (cópia)';q.pieces.push(n);nav.pi=q.pieces.length-1;save();render();break}
    case 'del-piece':confirmTap(b,()=>{q.pieces=q.pieces.filter(x=>x.id!==v);nav.pi=0;save();render()});break;
    case 'add-rect':{const p=q.pieces[nav.pi];(p.d.rects=p.d.rects||[]).push({w:100,h:50,q:1,l:'Peça'});save();render();break}
    case 'del-rect':{q.pieces[nav.pi].d.rects.splice(+v,1);save();render();break}
    case 'del-line':q.lines.splice(+v,1);save();render();break;
    case 'quick-client':{const c={id:uid(),name:'Novo cliente',phone:'',email:'',address:'',notes:''};S.clients.unshift(c);q.clientId=c.id;save();nav.tab='cad';nav.cad='cli';nav.edit={kind:'clients',id:c.id};nav.qid=null;render();break}
    case 'del-quote':confirmTap(b,()=>{S.quotes=S.quotes.filter(x=>x.id!==v);nav.qid=null;save();render()});break;
    case 'addphoto':$('#filePhoto').click();break;
    case 'del-photo':q.photos.splice(+v,1);save();render();break;
    case 'ai':runAI(q);break;
    case 'ai-apply':{(q.ai.medidas||[]).forEach(m=>{const A=num(m.comprimento_cm),P=num(m.profundidade_cm);if(A>0&&P>0)q.pieces.push({id:uid(),type:'reta',name:String(m.peca||'Peça sugerida'),d:{A,P},saiaH:0,rodaH:0})});nav.sec='med';save();render();toast('Peças adicionadas. Confirme com a trena.');break}
    case 'pdf':if(calc(q).erro){toast('Corrija a margem e os impostos antes de gerar o PDF.');break}try{await saveFile(`orcamento-${q.num}.pdf`,buildPdf(q))}catch(err){toast('Não foi possível gerar o PDF.')}break;
    case 'mark-sent':setStatus(q,'Enviado');render();toast('Marcado como enviado.');break;
    case 'cad':nav.cad=v;render();break;
    case 'add-cad':{const k=nav.cad;let o;
      if(k==='mat'){o={id:uid(),name:'Nova pedra',cat:'Granito',color:'',thick:2,priceSlab:0,priceM2:0,slabL:300,slabW:160,supplier:'',stock:0,photo:''};S.materials.unshift(o);nav.edit={kind:'materials',id:o.id}}
      else if(k==='svc'){o={id:uid(),name:'Novo serviço',cat:'Acabamentos',unit:'un',price:0};S.services.unshift(o);nav.edit={kind:'services',id:o.id}}
      else{o={id:uid(),name:'Novo cliente',phone:'',email:'',address:'',notes:''};S.clients.unshift(o);nav.edit={kind:'clients',id:o.id}}
      save();render();scrollTo(0,0);break}
    case 'edit':nav.edit={kind:b.dataset.k,id:v};render();scrollTo(0,0);break;
    case 'edit-close':nav.edit=null;render();break;
    case 'del-cad':confirmTap(b,()=>{const {kind,id}=nav.edit;S[kind]=S[kind].filter(x=>x.id!==id);nav.edit=null;save();render()});break;
    case 'mat-photo':pendingMat=v;$('#fileMat').click();break;
    case 'mat-photo-del':S.materials.find(x=>x.id===v).photo='';save();render();break;
    case 'theme':S.settings.theme=v;applyTheme();save();render();break;
    case 'export':saveFile(`marmofacil-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S));break;
    case 'import':$('#fileImport').click();break;
    case 'clear-ex':confirmTap(b,()=>{['materials','services','clients','quotes'].forEach(k=>S[k]=S[k].filter(x=>!x.ex));save();render();toast('Exemplos removidos.')});break;
    case 'reset':confirmTap(b,()=>{S={materials:[],services:[],clients:[],quotes:[],settings:{...S.settings,nextNum:1001}};save();nav.qid=null;nav.edit=null;render();toast('Tudo apagado.')});break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card.tap')){e.preventDefault();e.target.click()}});

/* Atualização ao vivo: não recria os campos para não perder o foco */
function live(){
  const q=curQ();if(!q)return;
  const sb=$('#sumbar');if(sb)sb.outerHTML=sumBar(q);
  if(nav.sec==='med'){const p=q.pieces[nav.pi];if(p&&$('#pdraw')){$('#pdraw').innerHTML=drawPiece(p);$('#parea').textContent=nf(partsArea(shape(p).parts))+' m²'}atualizar3d()}
  if(nav.sec==='svc'){q.lines.forEach((l,i)=>{const s=S.services.find(x=>x.id===l.svcId),el=$('#ls'+i);if(el&&s)el.textContent=brl(s.price*l.qty)});const c=calc(q);$('#svcsub').textContent=brl(c.svc)}
  if(nav.sec==='cal'){const t=document.createElement('template');t.innerHTML=secCal(q);
    ['#calcbox','#aprov','#plano'].forEach(id=>{const n=t.content.querySelector(id),o=$(id);if(n&&o)o.innerHTML=n.innerHTML})}
}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-b]');if(!el||el.tagName==='SELECT')return;
  if(fechado(curQ())&&el.closest('#secbody'))return;
  const old=getPath(el.dataset.b);
  const val=el.dataset.t==='n'?num(el.value):el.value;
  setPath(el.dataset.b,val);save();
  const cond=/\.(saiaH|rodaH)$/.test(el.dataset.b)&&((old>0)!==(val>0));
  if(cond){const path=el.dataset.b;render();const n=$(`[data-b="${path}"]`);if(n){n.focus();const L=n.value.length;try{n.setSelectionRange(L,L)}catch(x){}}}
  else live();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(fechado(curQ())&&el.closest('#secbody'))return;
  if(el.id==='addSvc'){const q=curQ();if(el.value){const f=q.lines.find(l=>l.svcId===el.value);if(f)f.qty+=1;else q.lines.push({svcId:el.value,qty:1});save();render()}return}
  if(el.matches('select[data-b]')&&el.dataset.b.endsWith('.status')){const q2=curQ();if(q2)setStatus(q2,el.value);render();return}
  if(el.matches('select[data-b]')){setPath(el.dataset.b,el.dataset.t==='n'?num(el.value):el.value);
    const q=curQ();if(q&&/\.materialId$/.test(el.dataset.b)){const m=matOf(q);if(m)q.params.charge=m.priceSlab>0?'chapa':'m2'}
    save();render();return}
  if(el.id==='filePhoto'&&el.files[0]){const q=curQ();readImg(el.files[0]).then(u=>{q.photos.push(u);save();render();toast('Foto salva no orçamento.')}).catch(()=>toast('Não foi possível ler a foto.'));el.value='';return}
  if(el.id==='fileMat'&&el.files[0]&&pendingMat){const m=S.materials.find(x=>x.id===pendingMat);readImg(el.files[0],600).then(u=>{m.photo=u;save();render()}).catch(()=>toast('Não foi possível ler a foto.'));el.value='';return}
  if(el.id==='fileImport'&&el.files[0]){
    el.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.quotes)||!Array.isArray(d.materials))throw 0;S=d;garantirSnapshots();save();applyTheme();nav.qid=null;nav.edit=null;render();toast('Backup restaurado.')}catch(x){toast('Arquivo de backup inválido.')}});el.value='';
  }
});

/* ===== Início ===== */
load();garantirSnapshots();applyTheme();render();
if(window.pfAbriu)window.pfAbriu();

/* Aviso de nova versão: o app abre da cópia guardada; quando uma versão nova assume, oferece recarregar. */
function avisoAtualizar(){
  if($('#upd'))return;
  const e=document.createElement('div');e.id='upd';e.className='upd';e.setAttribute('role','status');
  e.innerHTML='<span>Nova versão disponível.</span><button class="pri" data-act="atualizar">Atualizar</button>';
  document.body.appendChild(e);
}
if('serviceWorker' in navigator){
  const tinhaControle=!!navigator.serviceWorker.controller;           // primeira instalação não avisa
  navigator.serviceWorker.addEventListener('controllerchange',async()=>{if(!tinhaControle)return;try{const k=await versoesEmCache();if(k.length&&k[k.length-1]>APP_V)avisoAtualizar()}catch(e){avisoAtualizar()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.update().catch(()=>{});                                       // procura versão nova a cada abertura
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
